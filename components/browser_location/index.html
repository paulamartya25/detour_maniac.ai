<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:Arial,sans-serif}.card{align-items:center;background:#f7fcff;border:1px solid #a9dcec;border-radius:12px;box-sizing:border-box;display:flex;gap:14px;justify-content:space-between;min-height:72px;padding:14px 16px}.copy{color:#14384e;font-size:14px;line-height:1.35}.copy strong{display:block;font-size:15px;margin-bottom:2px}button{background:#007ca8;border:0;border-radius:8px;color:white;cursor:pointer;font-size:14px;font-weight:700;padding:10px 14px}button:disabled{cursor:wait;opacity:.7}@media(max-width:520px){.card{align-items:flex-start;flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<div class="card"><div class="copy"><strong id="heading">See distances from your location</strong><span id="detail">Share GPS location to compare nearby attractions.</span></div><button id="share" type="button">Share location</button></div>
<script>
const button=document.getElementById("share"),heading=document.getElementById("heading"),detail=document.getElementById("detail");
function send(type,properties){window.parent.postMessage({isStreamlitMessage:true,type,...properties},"*")}function setValue(value){send("streamlit:setComponentValue",{value})}
function resize(){send("streamlit:setFrameHeight",{height:document.body.scrollHeight})}
function saved(){heading.textContent="Location shared";detail.textContent="Distances below use your current browser location.";button.textContent="Update location"}
button.addEventListener("click",()=>{if(!navigator.geolocation){const message="This browser does not support location sharing.";detail.textContent=message;setValue({status:"error",message});return}button.disabled=true;button.textContent="Requesting...";navigator.geolocation.getCurrentPosition(position=>{saved();button.disabled=false;setValue({status:"success",latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy:position.coords.accuracy})},error=>{const message=error.code===error.PERMISSION_DENIED?"Permission was not granted. You can enable it in browser settings.":"Location could not be read. Please try again.";detail.textContent=message;button.disabled=false;button.textContent="Try again";setValue({status:"error",message})},{enableHighAccuracy:true,timeout:15000})});
window.addEventListener("message",event=>{if(event.data.type==="streamlit:render"){if(event.data.args&&event.data.args.has_location)saved();resize()}});
send("streamlit:componentReady",{apiVersion:1});resize();
</script>
</body>
</html>
